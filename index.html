<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi dan Jadwal Overtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-track { background: #f1f5f9; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .overflow-x-auto::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sticky-col-1 { position: sticky; left: 0; z-index: 20; }
        .sticky-col-2 { position: sticky; left: 50px; z-index: 20; }

        /* Warna jam OT (sesuai referensi) */
        .ot-c-3awal  { background:#FFE5A0; border-color:#F0BF5A; color:#6B4700; }
        .ot-c-3akhir { background:#D5E8C4; border-color:#9BC57C; color:#2B5415; }
        .ot-c-7s1    { background:#BFE1F7; border-color:#7DB8E3; color:#124568; }
        .ot-c-7s2    { background:#C5D7E0; border-color:#8DA9B8; color:#2A4150; }
        .ot-c-7s3    { background:#E3CEEE; border-color:#B58FCE; color:#4B2866; }
        .ot-c-1      { background:#F9CDD8; border-color:#E395AA; color:#76243D; }

        .ot-preset-btn { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        .ot-preset-btn:hover { filter: brightness(0.95); }
        button, [onclick] { touch-action: manipulation; }

        /* Highlight baris + kolom saat hover, supaya mudah mencocokkan nama dengan tanggal */
        th.col-hl, td.col-hl { box-shadow: inset 0 0 0 9999px rgba(16,185,129,.12); }
        tbody tr:hover > td { box-shadow: inset 0 0 0 9999px rgba(16,185,129,.08); }
        tbody tr:hover > td.col-hl { box-shadow: inset 0 0 0 9999px rgba(16,185,129,.26); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- Toast -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-in-out bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg" class="text-sm font-medium">Berhasil disimpan</span>
    </div>

    <div class="max-w-[1600px] mx-auto p-3 sm:p-6 space-y-6">

        <!-- Header -->
        <header class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="h-12 px-3 bg-white border border-slate-200 rounded-xl flex items-center justify-center shadow-sm">
                    <img src="assets/sharp-logo.png" alt="Logo SHARP" width="500" height="300" class="w-32 h-8 object-cover object-center">
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight">Simulasi dan Jadwal Overtime</h1>
                        <span id="cloudStatusBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300">Syncing...</span>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-500 font-medium">Washing Machine Production Dept.</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <button onclick="loadDataFromCloud(true)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-rotate text-red-600"></i> Refresh Data
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-file-excel"></i> Export Excel
                </button>
                <button onclick="openPeriodeModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-calendar-plus"></i> Kelola Periode
                </button>
            </div>
        </header>

        <!-- Controls -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-5 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Pilih Cut Off Periode</label>
                    <div class="relative">
                        <select id="periodeSelect" onchange="changePeriode(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 pr-8 text-xs sm:text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white appearance-none"></select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-xs text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Filter Shift</label>
                    <div class="relative">
                        <select id="shiftFilter" onchange="renderTables()" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 pr-8 text-xs sm:text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white appearance-none">
                            <option value="ALL">Semua Shift</option>
                            <option value="Shift 1">Shift 1</option>
                            <option value="Shift 2">Shift 2</option>
                            <option value="Shift 3">Shift 3</option>
                            <option value="NS">Non Shift (NS)</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-xs text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Filter Grup</label>
                    <div class="relative">
                        <select id="groupFilter" onchange="renderTables()" class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2.5 px-3 pr-8 text-xs sm:text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white appearance-none">
                            <option value="ALL">Semua Grup</option>
                            <option value="A">Grup A</option>
                            <option value="B">Grup B</option>
                            <option value="C">Grup C</option>
                            <option value="D">Grup D</option>
                            <option value="E">Grup E</option>
                            <option value="FL">Grup FL</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-xs text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-3 border-t border-slate-100">
                <div class="relative w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="renderTables()" placeholder="Cari nama karyawan..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white">
                </div>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                    <button onclick="toggleAutoSort()" id="autoSortBtn" class="px-3.5 py-2 bg-emerald-50 border-emerald-300 text-slate-700 hover:bg-slate-200 border rounded-xl text-xs font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-arrow-down-wide-short text-emerald-600"></i>
                        <span>Urutkan Total Jam: <strong id="sortStatusText">Aktif</strong></span>
                    </button>
                    <button onclick="openEmployeeModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-medium transition shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Tambah Karyawan
                    </button>
                </div>
            </div>
        </div>

        <div id="tablesContainer" class="space-y-6"></div>
    </div>

    <!-- Modal Input Jam OT -->
    <div id="otModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-slate-100">
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-clock text-emerald-400"></i>
                    <h3 class="font-bold text-base sm:text-lg" id="modalTitle">Input Jam Overtime</h3>
                </div>
                <button onclick="closeOTModal()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <form id="otForm" onsubmit="saveOT(event)" class="p-5 space-y-4">
                <input type="hidden" id="modalEmpId">
                <input type="hidden" id="modalDateIndex">

                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Nama Karyawan</label>
                        <input type="text" id="modalEmpName" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm font-semibold text-slate-700 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Tanggal</label>
                        <input type="text" id="modalDateLabel" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm font-semibold text-slate-700 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Pilih Opsi Overtime</label>
                    <input type="hidden" id="modalOtHours" value="0">
                    <input type="hidden" id="modalNote" value="">

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                        <button type="button" onclick="selectOTPreset(3, '3 Awal')" ondblclick="quickSaveOT(3, '3 Awal')" class="ot-preset-btn ot-c-3awal p-3 rounded-xl border-2 transition flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95" data-preset="3 Awal">
                            <span class="text-sm sm:text-base font-extrabold">3 Awal</span>
                            <span class="text-[10px] font-bold opacity-80">3 Jam (Kuning)</span>
                        </button>
                        <button type="button" onclick="selectOTPreset(3, '3 Akhir')" ondblclick="quickSaveOT(3, '3 Akhir')" class="ot-preset-btn ot-c-3akhir p-3 rounded-xl border-2 transition flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95" data-preset="3 Akhir">
                            <span class="text-sm sm:text-base font-extrabold">3 Akhir</span>
                            <span class="text-[10px] font-bold opacity-80">3 Jam (Hijau)</span>
                        </button>
                        <button type="button" onclick="selectOTPreset(7, '7 S1')" ondblclick="quickSaveOT(7, '7 S1')" class="ot-preset-btn ot-c-7s1 p-3 rounded-xl border-2 transition flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95" data-preset="7 S1">
                            <span class="text-sm sm:text-base font-extrabold">7 S1</span>
                            <span class="text-[10px] font-bold opacity-80">7 Jam (Biru)</span>
                        </button>
                        <button type="button" onclick="selectOTPreset(7, '7 S2')" ondblclick="quickSaveOT(7, '7 S2')" class="ot-preset-btn ot-c-7s2 p-3 rounded-xl border-2 transition flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95" data-preset="7 S2">
                            <span class="text-sm sm:text-base font-extrabold">7 S2</span>
                            <span class="text-[10px] font-bold opacity-80">7 Jam (Abu-abu)</span>
                        </button>
                        <button type="button" onclick="selectOTPreset(7, '7 S3')" ondblclick="quickSaveOT(7, '7 S3')" class="ot-preset-btn ot-c-7s3 p-3 rounded-xl border-2 transition flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95" data-preset="7 S3">
                            <span class="text-sm sm:text-base font-extrabold">7 S3</span>
                            <span class="text-[10px] font-bold opacity-80">7 Jam (Ungu)</span>
                        </button>
                        <button type="button" onclick="selectOTPreset(1, '1')" ondblclick="quickSaveOT(1, '1')" class="ot-preset-btn ot-c-1 p-3 rounded-xl border-2 transition flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95" data-preset="1">
                            <span class="text-sm sm:text-base font-extrabold">1</span>
                            <span class="text-[10px] font-bold opacity-80">1 Jam (Pink)</span>
                        </button>
                    </div>

                    <p class="mt-2.5 text-center text-[11px] text-slate-400"><i class="fa-regular fa-hand-pointer mr-1"></i>Klik 2x pada pilihan untuk langsung menyimpan</p>

                    <div class="mt-3 text-center">
                        <button type="button" onclick="selectOTPreset(0, '')" ondblclick="quickSaveOT(0, '')" class="text-xs text-rose-600 hover:text-rose-800 hover:underline font-semibold transition">
                            <i class="fa-solid fa-eraser mr-1"></i> Hapus / Kosongkan Jam OT
                        </button>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeOTModal()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-xl text-xs sm:text-sm font-semibold hover:bg-slate-50 transition">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-semibold transition shadow-md">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Karyawan -->
    <div id="empModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-slate-100">
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-base sm:text-lg" id="empModalTitle">Tambah Karyawan Baru</h3>
                <button onclick="closeEmpModal()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <form id="empForm" onsubmit="saveEmployee(event)" class="p-5 space-y-4">
                <input type="hidden" id="empIdInput">

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nama Karyawan</label>
                    <input type="text" id="empNameInput" required placeholder="Contoh: ADE KURNIADI" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Kategori</label>
                    <select id="empCategoryInput" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                        <option value="LEADER">LEADER</option>
                        <option value="GRUP">GRUP</option>
                        <option value="PART_CONTROL">PART CONTROL</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Shift</label>
                        <select id="empShiftInput" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                            <option value="Shift 1">Shift 1</option>
                            <option value="Shift 2">Shift 2</option>
                            <option value="Shift 3">Shift 3</option>
                            <option value="NS">NS</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Grup</label>
                        <select id="empGroupInput" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                            <option value="A">Grup A</option>
                            <option value="B">Grup B</option>
                            <option value="C">Grup C</option>
                            <option value="D">Grup D</option>
                            <option value="E">Grup E</option>
                            <option value="FL">Grup FL</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeEmpModal()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-xl text-xs sm:text-sm font-semibold hover:bg-slate-50 transition">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-semibold transition shadow-md">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Periode -->
    <div id="periodeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-slate-100">
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-base sm:text-lg">Kelola Cut Off Periode</h3>
                <button onclick="closePeriodeModal()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <form id="periodeForm" onsubmit="savePeriode(event)" class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Nama Periode</label>
                    <input type="text" id="periodeNameInput" placeholder="Contoh: CUT OFF DESEMBER 2026" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Tanggal Mulai</label>
                        <input type="date" id="periodeStartDateInput" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Tanggal Akhir</label>
                        <input type="date" id="periodeEndDateInput" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closePeriodeModal()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-xl text-xs sm:text-sm font-semibold hover:bg-slate-50 transition">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-semibold transition shadow-md">Tambah Periode</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="px-3 py-6 text-center text-xs text-slate-500">powered by NWBC</footer>

    <script>
        // =====================================================
        // KONFIGURASI
        // =====================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTCKf-Bg5WgGxoX309gzFSf-YEWb2oxm-XCVQ_YvP8oNu8h-G9BhzQcSvrk71Mh3MsdA/exec";
        const POLL_INTERVAL_MS = 5000; // cek perubahan dari user lain tiap 5 detik

        // Data contoh: HANYA dipakai untuk mengisi database yang masih kosong (seed)
        const DEFAULT_PERIODES = [
            { id: 'p1', name: 'CUT OFF NOVEMBER 2026', startDate: '2026-11-08', endDate: '2026-11-14' }
        ];
        const DEFAULT_EMPLOYEES = [
            { id: 1, category: 'LEADER', name: 'ADE KURNIADI', shift: 'Shift 1', group: 'A', otData: { 'p1': { 0: { hours: 7, note: '7 S3' }, 6: { hours: 7, note: '7 S3' } } } },
            { id: 2, category: 'LEADER', name: 'KOMARUDIN', shift: 'Shift 1', group: 'B', otData: { 'p1': { 0: { hours: 7, note: '7 S3' }, 6: { hours: 7, note: '7 S3' } } } },
            { id: 3, category: 'LEADER', name: 'EKA APRIANA', shift: 'Shift 2', group: 'B', otData: { 'p1': { 0: { hours: 7, note: '7 S3' }, 6: { hours: 7, note: '7 S3' } } } },
            { id: 4, category: 'LEADER', name: 'HENDRA', shift: 'Shift 2', group: 'C', otData: { 'p1': { 0: { hours: 7, note: '7 S3' }, 6: { hours: 7, note: '7 S3' } } } },
            { id: 5, category: 'LEADER', name: 'MARHALI', shift: 'Shift 3', group: 'D', otData: { 'p1': { 0: { hours: 7, note: '7 S3' }, 6: { hours: 7, note: '7 S3' } } } },
            { id: 6, category: 'LEADER', name: 'JESIKA ENO KUMALASARI', shift: 'Shift 3', group: 'D', otData: { 'p1': { 0: { hours: 7, note: '7 S3' }, 6: { hours: 7, note: '7 S3' } } } },
            { id: 7, category: 'LEADER', name: 'EKO BUDIYANTO', shift: 'NS', group: 'A', otData: { 'p1': { 1: { hours: 3, note: '3 Akhir' }, 2: { hours: 3, note: '3 Akhir' }, 3: { hours: 3, note: '3 Akhir' }, 4: { hours: 3, note: '3 Akhir' }, 6: { hours: 7, note: '7 S1' } } } },
            { id: 8, category: 'LEADER', name: 'SULISTIYONO', shift: 'Shift 1', group: 'C', otData: { 'p1': { 6: { hours: 7, note: '7 S1' } } } },

            { id: 10, category: 'LEADER', name: 'RIVAL ADITYA', shift: 'Shift 2', group: 'C', otData: { 'p1': { 6: { hours: 7, note: '7 S1' } } } },

        // =====================================================
        // STATE
        // =====================================================
        let periodes = [];
        let employees = [];
        let currentPeriodeId = null;
        let dates = [];
        let autoSortEnabled = true;

        let serverVersion = 0;   // versi data terakhir dari server
        let pendingSaves = 0;    // jumlah penyimpanan yang sedang berjalan
        let hasLoadedOnce = false;
        let toastTimer = null;

        // =====================================================
        // INIT
        // =====================================================
        window.addEventListener('DOMContentLoaded', () => {
            renderPeriodeOptions();
            renderTables();
            loadDataFromCloud(true);

            // Real-time: polling berkala + saat tab kembali aktif
            setInterval(() => {
                if (document.hidden || pendingSaves > 0) return;
                loadDataFromCloud(false);
            }, POLL_INTERVAL_MS);

            setupColumnHighlight();

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && pendingSaves === 0) loadDataFromCloud(false);
            });
        });

        // Highlight kolom tanggal saat kursor di atas sel (baris di-highlight lewat CSS)
        function setupColumnHighlight() {
            const tc = document.getElementById('tablesContainer');
            let hlTable = null, hlCol = null;
            const clear = () => {
                if (hlTable) hlTable.querySelectorAll('.col-hl').forEach(el => el.classList.remove('col-hl'));
                hlTable = null; hlCol = null;
            };
            tc.addEventListener('mouseover', e => {
                const cell = e.target.closest('td[data-col]');
                const table = cell ? cell.closest('table') : null;
                const col = cell ? cell.dataset.col : null;
                if (table === hlTable && col === hlCol) return;
                clear();
                if (!cell) return;
                table.querySelectorAll(`[data-col="${col}"]`).forEach(el => el.classList.add('col-hl'));
                hlTable = table; hlCol = col;
            });
            tc.addEventListener('mouseleave', clear);
        }

        // =====================================================
        // CLOUD SYNC
        // =====================================================
        function updateCloudBadge(status, text) {
            const badge = document.getElementById('cloudStatusBadge');
            if (!badge) return;
            badge.textContent = text;
            const base = 'text-[10px] font-bold px-2 py-0.5 rounded-full border ';
            if (status === 'synced') badge.className = base + 'bg-emerald-100 text-emerald-800 border-emerald-300';
            else if (status === 'syncing') badge.className = base + 'bg-amber-100 text-amber-800 border-amber-300';
            else badge.className = base + 'bg-rose-100 text-rose-800 border-rose-300';
        }

        // Terapkan data dari server ke tampilan
        function applyState(result) {
            employees = Array.isArray(result.employees) ? result.employees : [];
            periodes = Array.isArray(result.periodes) ? result.periodes : [];
            if (result.version) serverVersion = result.version;

            if (!periodes.find(p => p.id === currentPeriodeId)) {
                currentPeriodeId = periodes.length ? periodes[periodes.length - 1].id : null;
            }
            renderPeriodeOptions();
            setupCurrentPeriodeDates();
            renderTables();
        }

        // force = true -> selalu ambil data penuh; false -> hanya kalau versi di server berubah
        async function loadDataFromCloud(force = false) {
            if (force) updateCloudBadge('syncing', 'Menghubungkan Cloud...');
            try {
                const since = force ? 0 : serverVersion;
                const url = `${GOOGLE_SCRIPT_URL}?since=${since}&_=${Date.now()}`;
                const response = await fetch(url);
                const result = await response.json();
                if (!result || result.status !== 'success') throw new Error(result && result.message || 'Respon tidak valid');

                // Jika ada penyimpanan yang mulai berjalan saat menunggu respon, jangan timpa
                if (pendingSaves > 0) return;

                if (result.changed) {
                    // Database kosong -> isi dengan data awal (sekali saja)
                    if (!hasLoadedOnce && (!result.employees || result.employees.length === 0) && (!result.periodes || result.periodes.length === 0)) {
                        applyState({ employees: DEFAULT_EMPLOYEES, periodes: DEFAULT_PERIODES, version: 0 });
                        hasLoadedOnce = true;
                        await callApi({ action: 'seed', employees: DEFAULT_EMPLOYEES, periodes: DEFAULT_PERIODES });
                        return;
                    }
                    applyState(result);
                }
                hasLoadedOnce = true;
                updateCloudBadge('synced', 'ONLINE');
            } catch (err) {
                console.warn('Gagal memuat data dari cloud:', err);
                updateCloudBadge('offline', 'Offline');
                if (force) showToast('Gagal terhubung ke cloud', true);
            }
        }

        // Kirim satu perubahan ke server. Server mengembalikan data terbaru.
        async function callApi(payload) {
            pendingSaves++;
            updateCloudBadge('syncing', 'Menyimpan...');
            let result = null;
            let failed = false;
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    // text/plain = "simple request": tidak memicu preflight CORS (Apps Script tidak mendukung OPTIONS)
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                result = await response.json();
                if (!result || result.status !== 'success') throw new Error(result && result.message || 'Respon tidak valid');
            } catch (err) {
                console.error('Gagal menyimpan ke cloud:', err);
                failed = true;
            } finally {
                pendingSaves--;
            }

            if (failed) {
                updateCloudBadge('offline', 'Gagal Simpan');
                showToast('Gagal menyimpan ke cloud, memuat ulang data...', true);
                await loadDataFromCloud(true);
                return null;
            }

            if (pendingSaves === 0) {
                applyState(result);
                updateCloudBadge('synced', 'ONLINE');
            } else {
                serverVersion = result.version || serverVersion;
            }
            return result;
        }

        // =====================================================
        // HELPERS
        // =====================================================
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            document.getElementById('toastIcon').className = isError
                ? 'fa-solid fa-circle-xmark text-rose-400 text-lg'
                : 'fa-solid fa-circle-check text-emerald-400 text-lg';

            toast.classList.remove('translate-x-full');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        function getOTBadgeClass(note) {
            switch (note) {
                case '3 Awal': return 'ot-c-3awal font-bold';
                case '3 Akhir': return 'ot-c-3akhir font-bold';
                case '7 S1': return 'ot-c-7s1 font-bold';
                case '7 S2': return 'ot-c-7s2 font-bold';
                case '7 S3': return 'ot-c-7s3 font-bold';
                case '1': return 'ot-c-1 font-bold';
                default:        return 'bg-slate-100 text-slate-700 border-slate-200';
            }
        }

        function getEmpTotal(emp) {
            let total = 0;
            const p = emp.otData && emp.otData[currentPeriodeId];
            if (p) Object.values(p).forEach(d => { total += (d.hours || 0); });
            return total;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function toLocalISO(d) {
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${m}-${day}`;
        }

        // =====================================================
        // PERIODE
        // =====================================================
        function renderPeriodeOptions() {
            const select = document.getElementById('periodeSelect');
            select.innerHTML = periodes.map(p =>
                `<option value="${escapeHtml(p.id)}" ${p.id === currentPeriodeId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
            ).join('');
        }

        function setupCurrentPeriodeDates() {
            dates = [];
            const periode = periodes.find(p => p.id === currentPeriodeId);
            if (!periode) return;

            const start = new Date(periode.startDate + 'T00:00:00');
            const end = new Date((periode.endDate || periode.startDate) + 'T00:00:00');
            const daysCount = Math.round(Math.abs(end - start) / 86400000) + 1;
            const daysIndo = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

            for (let i = 0; i < daysCount; i++) {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                dates.push({
                    index: i,
                    day: daysIndo[d.getDay()],
                    label: `${d.getDate()}/${d.getMonth() + 1}`,
                    weekend: d.getDay() === 0 || d.getDay() === 6,
                    fullDate: toLocalISO(d)
                });
            }
        }

        function changePeriode(pId) {
            currentPeriodeId = pId;
            setupCurrentPeriodeDates();
            renderTables(true);
            showToast('Periode berhasil diubah');
        }

        function openPeriodeModal() {
            document.getElementById('periodeForm').reset();
            document.getElementById('periodeModal').classList.remove('hidden');
            document.getElementById('periodeModal').classList.add('flex');
        }

        function closePeriodeModal() {
            document.getElementById('periodeModal').classList.add('hidden');
            document.getElementById('periodeModal').classList.remove('flex');
        }

        function savePeriode(e) {
            e.preventDefault();
            const name = document.getElementById('periodeNameInput').value.trim().toUpperCase();
            const startDate = document.getElementById('periodeStartDateInput').value;
            const endDate = document.getElementById('periodeEndDateInput').value;

            if (new Date(endDate) < new Date(startDate)) {
                showToast('Tanggal akhir tidak boleh lebih awal dari tanggal mulai!', true);
                return;
            }

            const periode = { id: 'p' + Date.now(), name, startDate, endDate };
            periodes.push(periode);
            currentPeriodeId = periode.id;

            renderPeriodeOptions();
            setupCurrentPeriodeDates();
            renderTables();
            closePeriodeModal();
            showToast('Periode baru berhasil dibuat');
            callApi({ action: 'add_periode', periode });
        }

        // =====================================================
        // KARYAWAN
        // =====================================================
        function openEmployeeModal(empId = null, presetCategory = null) {
            document.getElementById('empForm').reset();

            if (empId) {
                const emp = employees.find(e => e.id === empId);
                if (emp) {
                    document.getElementById('empModalTitle').textContent = 'Edit Data Karyawan';
                    document.getElementById('empIdInput').value = emp.id;
                    document.getElementById('empNameInput').value = emp.name;
                    document.getElementById('empCategoryInput').value = emp.category;
                    document.getElementById('empShiftInput').value = emp.shift;
                    document.getElementById('empGroupInput').value = emp.group;
                }
            } else {
                document.getElementById('empModalTitle').textContent = 'Tambah Karyawan Baru';
                document.getElementById('empIdInput').value = '';
                if (presetCategory) {
                    document.getElementById('empCategoryInput').value = presetCategory;
                    // ikuti filter yang sedang aktif supaya input lebih cepat
                    const sf = document.getElementById('shiftFilter').value;
                    const gf = document.getElementById('groupFilter').value;
                    if (sf !== 'ALL') document.getElementById('empShiftInput').value = sf;
                    if (gf !== 'ALL') document.getElementById('empGroupInput').value = gf;
                }
            }

            document.getElementById('empModal').classList.remove('hidden');
            document.getElementById('empModal').classList.add('flex');
        }

        function closeEmpModal() {
            document.getElementById('empModal').classList.add('hidden');
            document.getElementById('empModal').classList.remove('flex');
        }

        function saveEmployee(e) {
            e.preventDefault();
            const idVal = document.getElementById('empIdInput').value;
            const name = document.getElementById('empNameInput').value.trim().toUpperCase();
            const category = document.getElementById('empCategoryInput').value;
            const shift = document.getElementById('empShiftInput').value;
            const group = document.getElementById('empGroupInput').value;

            let payloadEmp;
            if (idVal) {
                const emp = employees.find(x => x.id === parseInt(idVal));
                if (!emp) { closeEmpModal(); return; }
                Object.assign(emp, { name, category, shift, group });
                payloadEmp = { id: emp.id, name, category, shift, group };
                showToast('Data karyawan diperbarui');
            } else {
                payloadEmp = { id: Date.now(), name, category, shift, group };
                employees.push({ ...payloadEmp, otData: {} });
                showToast('Karyawan baru ditambahkan');
            }

            renderTables();
            closeEmpModal();
            callApi({ action: 'upsert_employee', employee: payloadEmp });
        }

        function deleteEmployee(empId) {
            const emp = employees.find(e => e.id === empId);
            if (emp && confirm(`Apakah Anda yakin ingin menghapus ${emp.name}?`)) {
                employees = employees.filter(e => e.id !== empId);
                renderTables();
                showToast('Karyawan berhasil dihapus');
                callApi({ action: 'delete_employee', empId });
            }
        }

        // =====================================================
        // INPUT OT
        // =====================================================
        function selectOTPreset(hours, label) {
            document.getElementById('modalOtHours').value = hours;
            document.getElementById('modalNote').value = label;

            document.querySelectorAll('.ot-preset-btn').forEach(btn => {
                const active = btn.getAttribute('data-preset') === label;
                ['ring-2', 'ring-offset-2', 'ring-slate-800', 'scale-105', 'shadow-md'].forEach(c => btn.classList.toggle(c, active));
            });
        }

        // Klik 2x pada pilihan = pilih + langsung simpan (tombol Simpan Data tetap ada)
        function quickSaveOT(hours, label) {
            selectOTPreset(hours, label);
            saveOT({ preventDefault() {} });
        }

        function openOTModal(empId, dateIdx) {
            const emp = employees.find(e => e.id === empId);
            const dateObj = dates[dateIdx];
            if (!emp || !dateObj) return;

            document.getElementById('modalEmpId').value = empId;
            document.getElementById('modalDateIndex').value = dateIdx;
            document.getElementById('modalEmpName').value = emp.name;
            document.getElementById('modalDateLabel').value = `${dateObj.label} (${dateObj.day})`;

            const pData = (emp.otData && emp.otData[currentPeriodeId]) ? emp.otData[currentPeriodeId][dateIdx] : null;
            selectOTPreset(pData ? pData.hours : 0, pData ? (pData.note || '') : '');

            document.getElementById('otModal').classList.remove('hidden');
            document.getElementById('otModal').classList.add('flex');
        }

        function closeOTModal() {
            document.getElementById('otModal').classList.add('hidden');
            document.getElementById('otModal').classList.remove('flex');
        }

        function saveOT(e) {
            e.preventDefault();
            const empId = parseInt(document.getElementById('modalEmpId').value);
            const dateIdx = parseInt(document.getElementById('modalDateIndex').value);
            const hours = parseFloat(document.getElementById('modalOtHours').value) || 0;
            const note = document.getElementById('modalNote').value.trim();

            const emp = employees.find(x => x.id === empId);
            if (!emp) { closeOTModal(); return; }

            if (!emp.otData) emp.otData = {};
            if (!emp.otData[currentPeriodeId]) emp.otData[currentPeriodeId] = {};

            if (hours > 0) emp.otData[currentPeriodeId][dateIdx] = { hours, note };
            else delete emp.otData[currentPeriodeId][dateIdx];

            renderTables();
            closeOTModal();
            showToast(`Jam OT ${emp.name} berhasil diperbarui!`);
            callApi({ action: 'set_ot', empId, periodeId: currentPeriodeId, dayIndex: dateIdx, hours, note });
        }

        // =====================================================
        // RENDER
        // =====================================================
        function toggleAutoSort() {
            autoSortEnabled = !autoSortEnabled;
            document.getElementById('sortStatusText').textContent = autoSortEnabled ? 'Aktif' : 'Nonaktif';
            document.getElementById('autoSortBtn').classList.toggle('bg-emerald-50', autoSortEnabled);
            document.getElementById('autoSortBtn').classList.toggle('border-emerald-300', autoSortEnabled);
            renderTables();
        }

        function renderTables(resetScroll = false) {
            const container = document.getElementById('tablesContainer');

            // Simpan posisi scroll horizontal tiap tabel + scroll halaman sebelum dirender ulang
            const prevScrolls = resetScroll ? [] : Array.from(container.querySelectorAll('.table-scroll')).map(el => el.scrollLeft);
            const prevPageY = window.scrollY;
            container.innerHTML = '';

            const shiftVal = document.getElementById('shiftFilter').value;
            const groupVal = document.getElementById('groupFilter').value;
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const categories = [
                { key: 'LEADER', title: 'REKAP OVERTIME - LEADER', color: 'emerald' },
                { key: 'GRUP', title: 'REKAP OVERTIME - GRUP', color: 'teal' },
                { key: 'PART_CONTROL', title: 'REKAP OVERTIME - PART CONTROL', color: 'indigo' }
            ];

            categories.forEach(cat => {
                let filtered = employees.filter(e => e.category === cat.key);
                if (shiftVal !== 'ALL') filtered = filtered.filter(e => e.shift === shiftVal);
                if (groupVal !== 'ALL') filtered = filtered.filter(e => e.group === groupVal);
                if (searchVal) filtered = filtered.filter(e => e.name.toLowerCase().includes(searchVal));

                if (autoSortEnabled) filtered.sort((a, b) => getEmpTotal(b) - getEmpTotal(a));

                container.appendChild(createCategoryTable(cat, filtered));
            });

            // Kembalikan posisi scroll
            container.querySelectorAll('.table-scroll').forEach((el, i) => { el.scrollLeft = prevScrolls[i] || 0; });
            window.scrollTo(window.scrollX, prevPageY);
        }

        function createCategoryTable(category, catEmployees) {
            const wrapper = document.createElement('div');
            wrapper.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden';

            const dayTotals = dates.map(d => {
                let sum = 0;
                catEmployees.forEach(emp => {
                    const cell = emp.otData && emp.otData[currentPeriodeId] && emp.otData[currentPeriodeId][d.index];
                    if (cell) sum += (cell.hours || 0);
                });
                return sum;
            });
            const grandTotalCategory = dayTotals.reduce((a, b) => a + b, 0);

            let datesHeaderHtml = '';
            dates.forEach(d => {
                datesHeaderHtml += `
                    <th data-col="${d.index}" class="p-2 sm:p-2.5 text-center text-xs font-bold min-w-[70px] border-b border-r border-slate-200 ${d.weekend ? 'bg-slate-500 text-white' : 'bg-slate-100 text-slate-700'}">

                        <div>${d.label}</div>

            let rowsHtml = '';
            if (catEmployees.length === 0) {
                rowsHtml = `

                            Tidak ada data karyawan ditemukan.
                        </td>
                    </tr>`;
            } else {
                catEmployees.forEach((emp, idx) => {
                    let otCells = '';
                    dates.forEach(d => {
                        const cellData = (emp.otData && emp.otData[currentPeriodeId]) ? emp.otData[currentPeriodeId][d.index] : null;

                        const emptyClass = d.weekend
                            ? 'bg-slate-200 border-slate-400 text-slate-500 font-semibold hover:bg-white hover:border-emerald-500 hover:text-emerald-600'

                        const badgeClass = note ? getOTBadgeClass(String(note)) : emptyClass;

                        otCells += `
                            <td data-col="${d.index}" onclick="openOTModal(${emp.id}, ${d.index})" class="p-1.5 text-center border-b border-r border-slate-200 cursor-pointer transition ${d.weekend ? 'bg-slate-300' : ''}">
                                <div class="w-full py-1.5 px-1 rounded-lg text-xs transition border ${badgeClass}">${note ? escapeHtml(note) : '+'}</div>
                            </td>`;
                    });

                    rowsHtml += `
                        <tr class="transition ${idx % 2 ? 'bg-slate-50' : 'bg-white'}">
                            <td class="p-3 text-center text-xs font-semibold text-slate-400 border-b border-r border-slate-200 sticky-col-1 ${idx % 2 ? 'bg-slate-50' : 'bg-white'}">${idx + 1}</td>
                            <td class="p-3 border-b border-r border-slate-200 sticky-col-2 ${idx % 2 ? 'bg-slate-50' : 'bg-white'}">
                                <div class="flex items-center justify-between group">
                                    <span class="text-xs sm:text-sm font-bold text-slate-800">${escapeHtml(emp.name)}</span>
                                    <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1 transition">
                                        <button onclick="openEmployeeModal(${emp.id})" class="text-slate-400 hover:text-blue-600 p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteEmployee(${emp.id})" class="text-slate-400 hover:text-rose-600 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </td>
                            ${otCells}
                            <td class="p-3 text-center text-xs sm:text-sm font-black text-slate-800 bg-slate-50 border-b border-slate-200">${getEmpTotal(emp)}</td>
                        </tr>`;
                });

            let dayTotalsHtml = '';
            dayTotals.forEach((tot, i) => {

                        <span class="w-3 h-3 rounded-full bg-${category.color}-400"></span>

                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold px-3 py-1 bg-white/10 rounded-full">Total: ${grandTotalCategory} Jam</span>

                                <th class="p-3 text-xs font-bold text-slate-500 uppercase tracking-wider min-w-[200px] border-b border-r border-slate-200 sticky-col-2 bg-slate-100">NAMA KARYAWAN</th>
                                ${datesHeaderHtml}
                                <th class="p-3 text-center text-xs font-bold text-slate-700 uppercase tracking-wider min-w-[90px] border-b border-slate-200 bg-slate-200/70">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                        <tfoot>
                            <tr>
                                <td colspan="2" class="p-3 text-right text-xs font-bold text-slate-700 uppercase tracking-wider border-t-2 border-slate-300 border-r border-slate-200 sticky-col-1 bg-slate-100">TOTAL JAM OVERTIME</td>
                                ${dayTotalsHtml}
                                <td class="p-3 text-center text-sm font-black text-emerald-700 bg-slate-200 border-t-2 border-slate-300">${grandTotalCategory}</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>`;

            return wrapper;
        }

        // =====================================================
        // EXPORT (CSV, bisa dibuka di Excel)
        // =====================================================
        function exportToExcel() {
            const periode = periodes.find(p => p.id === currentPeriodeId);
            const q = v => `"${String(v).replace(/"/g, '""')}"`;

            let csv = `REKAP OVERTIME KARYAWAN - ${periode ? periode.name : ''}\n\n`;
            csv += ['No', 'Nama Karyawan', 'Kategori', 'Shift', 'Grup', ...dates.map(d => `${d.day} (${d.label})`), 'Total Jam'].map(q).join(',') + '\n';

            employees.forEach((emp, idx) => {
                const cells = dates.map(d => {
                    const data = (emp.otData && emp.otData[currentPeriodeId]) ? emp.otData[currentPeriodeId][d.index] : null;
                    return data ? (data.note || data.hours) : '0';
                });
                csv += [idx + 1, emp.name, emp.category, emp.shift, emp.group, ...cells, getEmpTotal(emp)].map(q).join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Rekap_Overtime_${periode ? periode.name.replace(/\s+/g, '_') : 'Export'}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            showToast('File CSV berhasil di-download');
        }
    </script>
</body>
